services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookstore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "BookStore_12345"
    ports:
      - "1433:1433"

  auth:
    build:
      context: .
      dockerfile: src/ProCredit.BookStore.Auth/Dockerfile
    container_name: bookstore-auth
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5019:8080"

  api:
    build:
      context: .
      dockerfile: src/ProCredit.BookStore.Api/Dockerfile
    container_name: bookstore-api
    depends_on:
      - sqlserver
      - auth
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProCreditBookStore;User Id=sa;Password=BookStore_12345;TrustServerCertificate=True;"
      Authentication__Authority: "http://auth:8080"
      Authentication__ValidIssuer: "http://localhost:5019"
    ports:
      - "5291:8080"